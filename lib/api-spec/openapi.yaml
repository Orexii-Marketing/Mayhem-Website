openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Mayhem Athletics API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: services
    description: Training services
  - name: registrations
    description: Athlete registrations
  - name: inquiries
    description: Contact inquiries
  - name: events
    description: Scheduled events and RSVPs
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all training services
      description: Returns all sports and their available training formats with pricing
      responses:
        "200":
          description: List of sports with training formats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SportService"

  /registrations:
    post:
      operationId: createRegistration
      tags: [registrations]
      summary: Submit a training registration
      description: Register an athlete for training — saves to Airtable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Registration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /event-templates:
    get:
      operationId: listEventTemplates
      tags: [events]
      summary: List schedule templates
      description: Returns available schedule templates from Airtable. Returns empty array when Airtable is not configured.
      responses:
        "200":
          description: List of schedule templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleTemplate"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List upcoming events
      description: Returns upcoming Active events sorted by date, falls back to mock events when Airtable is not configured
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a new event (admin only)
      description: Creates an event in Airtable. Requires Admin-Secret header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/{id}/schedule:
    get:
      operationId: getEventSchedule
      tags: [events]
      summary: Get the timed agenda for an event
      description: Returns the schedule lines for a specific event based on its linked schedule template.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSchedule"
        "404":
          description: Event or schedule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/{id}/rsvp:
    post:
      operationId: createEventRsvp
      tags: [events]
      summary: RSVP to an event
      description: Register a child for a specific event. Saves to Airtable Event RSVPs.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRsvpInput"
      responses:
        "201":
          description: RSVP submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRsvpResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inquiries:
    post:
      operationId: createInquiry
      tags: [inquiries]
      summary: Submit a contact inquiry
      description: Send a general inquiry — saves to Airtable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Inquiry submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InquiryResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    TrainingFormat:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: ["string", "null"]
        duration:
          type: ["string", "null"]
      required:
        - id
        - name
        - description

    SportService:
      type: object
      properties:
        sport:
          type: string
          enum: [football, soccer, basketball, baseball]
        label:
          type: string
        icon:
          type: string
        formats:
          type: array
          items:
            $ref: "#/components/schemas/TrainingFormat"
      required:
        - sport
        - label
        - icon
        - formats

    RegistrationInput:
      type: object
      properties:
        parentName:
          type: string
          minLength: 1
        athleteName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 7
        sport:
          type: string
          enum: [football, soccer, basketball, baseball]
        trainingFormat:
          type: string
        ageOrGrade:
          type: string
        skillLevel:
          type: string
          enum: [beginner, intermediate, advanced]
        notes:
          type: ["string", "null"]
      required:
        - parentName
        - athleteName
        - email
        - phone
        - sport
        - trainingFormat
        - ageOrGrade
        - skillLevel

    RegistrationResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        id:
          type: ["string", "null"]
      required:
        - success
        - message

    InquiryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: ["string", "null"]
        subject:
          type: string
        message:
          type: string
          minLength: 1
      required:
        - name
        - email
        - subject
        - message

    InquiryResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

    ScheduleTemplate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sport:
          type: ["string", "null"]
      required:
        - id
        - name

    EventSchedule:
      type: object
      properties:
        templateName:
          type: string
        lines:
          type: array
          items:
            type: string
      required:
        - templateName
        - lines

    Event:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [Practice, Scrimmage, Camp, Clinic]
        date:
          type: string
        time:
          type: string
        location:
          type: string
        capacity:
          type: number
        status:
          type: string
          enum: [Active, Published, Draft, Scheduled, Cancelled]
        registrantCount:
          type: ["number", "null"]
          description: Number of kids signed up for this event. Null when Airtable is not configured or the Count field is not set up.
        scheduleTemplateId:
          type: ["string", "null"]
          description: ID of the linked schedule template. Null when no template is attached.
        ageGroup:
          type: ["string", "null"]
          description: Age group label for this event (e.g. "U10", "8th–12th grade").
      required:
        - id
        - name
        - type
        - date
        - time
        - location
        - capacity
        - status

    EventInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [Practice, Scrimmage, Camp, Clinic]
        date:
          type: string
          minLength: 1
        time:
          type: string
          minLength: 1
        location:
          type: string
          minLength: 1
        capacity:
          type: number
        notes:
          type: ["string", "null"]
        scheduleTemplateId:
          type: ["string", "null"]
          description: ID of a Schedule Template record to link to this event.
      required:
        - name
        - type
        - date
        - time
        - location
        - capacity

    EventResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        id:
          type: ["string", "null"]
      required:
        - success
        - message

    EventRsvpInput:
      type: object
      properties:
        childName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 7
      required:
        - childName
        - email
        - phone

    EventRsvpResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        id:
          type: ["string", "null"]
      required:
        - success
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
